<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the installed app draw under the iPhone notch; screens pad with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rooted</title>
    <meta name="description" content="Know what to ask your kid, and when. Small talks, deep roots." />

    <!-- Installable web app (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#123a28" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iPhone / iPad: "Add to Home Screen" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rooted" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #f6f4f0;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Rooted.</noscript>
    <div id="root"></div>
  </body>
</html>
